name: SonarQube Cloud - CleanArchitecture

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: Compilación y análisis estático (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configurar Java para SonarScanner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar SonarScanner para .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Analizar solución con SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"julianhg21" \
            /o:"julianhg21" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io"

          dotnet build Clean.Architecture.slnx --configuration Release --no-incremental

          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
